name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Wait for default branch Pages build if running
        run: |
          echo "Checking if default 'pages build and deployment' is running..."
          sleep 6
          for i in {1..30}; do
            STATUS=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=${{ github.sha }}" \
              | jq -r '.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed") | .status' | head -n 1)
            if [ -z "$STATUS" ]; then
              echo "No active default pages build found. Proceeding with deployment."
              break
            fi
            echo "Default pages build is still '$STATUS' (attempt $i/30). Waiting 4s..."
            sleep 4
          done
          sleep 4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
